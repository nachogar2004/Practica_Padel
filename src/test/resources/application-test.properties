# Configuración de Base de Datos H2 en fichero separado para tests
spring.datasource.url=jdbc:h2:file:./dbdata/practica-test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema al iniciar el contexto y lo elimina al cerrarlo.
# Así cada test arranca con su propio fichero de base de datos.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deshabilitar consola H2 en tests
spring.h2.console.enabled=false
