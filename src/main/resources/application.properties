spring.application.name=PracticaFinal

# Sirve los ficheros estáticos de la carpeta docs/ desde http://localhost:8080/
spring.web.resources.static-locations=file:docs/,classpath:/static/

# Configuración de Base de Datos H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./dbdata/practica
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Trazas de Log (útil para debuguear vuestros @RequestMapping)
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
