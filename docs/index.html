<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pádel Reservas — Iniciar sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon">🎾</div>
      <h1>Pádel Reservas</h1>
      <p>Sistema de reserva de pistas de pádel</p>
    </div>

    <!-- Alert container -->
    <div id="alertContainer"></div>

    <!-- Formulario login -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
      </button>

      <div class="d-grid gap-2 mt-3">
        <button type="button" class="btn btn-outline-primary" id="demoUserBtn">
          Entrar como usuario demo
        </button>
        <button type="button" class="btn btn-outline-dark" id="demoAdminBtn">
          Entrar como admin demo
        </button>
      </div>
    </form>

    <hr class="my-3" />

    <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
      ¿No tienes cuenta?
      <a href="register.html" class="fw-semibold text-decoration-none" style="color:var(--primary);">Regístrate aquí</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api-client.js"></script>
<script>
  function showStaticAlert(message, type) {
    const container = document.getElementById('alertContainer');
    container.innerHTML = `<div class="alert alert-${type || 'info'} py-2" role="alert">${message}</div>`;
  }

  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon = this.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
  });

  const params = new URLSearchParams(window.location.search);
  const session = AppApi.getSession();
  if (session) {
    window.location.href = session.rol === 'ADMIN' ? 'admin.html' : 'dashboard.html';
  }

  if (params.get('registered') === '1') {
    showStaticAlert('Cuenta creada en modo demo. Ya puedes iniciar sesion.', 'success');
  }

  document.getElementById('demoUserBtn').addEventListener('click', async function () {
    await AppApi.login('demo@padel.local', 'demo123');
    window.location.href = 'dashboard.html';
  });

  document.getElementById('demoAdminBtn').addEventListener('click', async function () {
    await AppApi.login('admin@padel.local', 'admin123');
    window.location.href = 'admin.html';
  });

  // Submit login
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showStaticAlert('Por favor, completa todos los campos.', 'warning');
      return;
    }

    showStaticAlert('Accediendo...', 'info');
    const result = await AppApi.login(email, password);
    if (!result.ok) {
      showStaticAlert(result.message || 'No se pudo iniciar sesion.', 'danger');
      return;
    }

    window.location.href = result.user.rol === 'ADMIN' ? 'admin.html' : 'dashboard.html';
  });
</script>
</body>
</html>
