<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pádel Reservas — Registro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card" style="max-width:500px;">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon">🎾</div>
      <h1>Crear cuenta</h1>
      <p>Regístrate para reservar pistas de pádel</p>
    </div>

    <!-- Alert container -->
    <div id="alertContainer"></div>

    <!-- Formulario registro -->
    <form id="registerForm" novalidate>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Juan" required autocomplete="given-name" />
        </div>
        <div class="col-6">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input type="text" class="form-control" id="apellidos" placeholder="García López" required autocomplete="family-name" />
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono <span class="text-muted">(opcional)</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-telephone"></i></span>
          <input type="tel" class="form-control" id="telefono" placeholder="600 000 000" autocomplete="tel" />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6" />
          <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label for="password2" class="form-label">Confirmar contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control" id="password2" placeholder="Repite la contraseña" required autocomplete="new-password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn">
        <i class="bi bi-person-plus me-2"></i>Crear cuenta
      </button>
    </form>

    <hr class="my-3" />

    <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
      ¿Ya tienes cuenta?
      <a href="index.html" class="fw-semibold text-decoration-none" style="color:var(--primary);">Inicia sesión</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function showStaticAlert(message, type) {
    const container = document.getElementById('alertContainer');
    container.innerHTML = `<div class="alert alert-${type || 'info'} py-2" role="alert">${message}</div>`;
  }

  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon = this.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
  });

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const nombre    = document.getElementById('nombre').value.trim();
    const apellidos = document.getElementById('apellidos').value.trim();
    const email     = document.getElementById('email').value.trim();
    const telefono  = document.getElementById('telefono').value.trim();
    const password  = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (!nombre || !apellidos || !email || !password) {
      showStaticAlert('Por favor, completa todos los campos obligatorios.', 'warning');
      return;
    }
    if (password.length < 6) {
      showStaticAlert('La contraseña debe tener al menos 6 caracteres.', 'warning');
      return;
    }
    if (password !== password2) {
      showStaticAlert('Las contraseñas no coinciden.', 'warning');
      return;
    }

    showStaticAlert('Modo demo visual: el registro no está conectado al backend.', 'info');
  });
</script>
</body>
</html>
